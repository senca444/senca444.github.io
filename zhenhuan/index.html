</style></head><body><main class="wrap"><header class="hero"><div class="eyebrow">宫 · 廷 · 人 · 生 · 图 · 鉴</div><h1>测测你最像<br>甄嬛传里的谁</h1><p>入宫一程，照见本心 · 寻找你的角色映像</p><div class="seal">二十四道心境 · 一场东方人物映照</div></header><section id="intro" class="panel intro"><h2>若你身在紫禁城</h2><p>是甄嬛般清醒坚韧，华妃般炽烈真诚，<br>还是眉庄般端庄自持？</p><p>凭第一直觉作答，看看哪位角色与你最相似。</p><p style="color:#9a7544;font-size:13px">本测试为娱乐向性格趣味匹配，不代表角色或现实人物评价。</p><button class="btn" id="start">启卷测一测</button></section><section id="quiz" class="panel hidden"><div class="qcount" id="qcount"></div><div class="progress"><div class="bar" id="bar"></div></div><div class="question" id="question"></div><div class="options" id="options"></div></section><section id="result" class="panel result hidden"><div class="eyebrow" style="color:#936c3a">你的宫廷人格是</div><img id="portrait" alt="角色卡通画像"><h2 id="name"></h2><div class="subtitle" id="title"></div><div class="quote" id="quote"></div><p class="desc" id="desc"></p><div class="tags" id="tags"></div><button class="btn" id="save">保存专属海报 PNG</button> <button class="btn" id="again">再测一次</button><canvas id="posterCanvas" class="posterCanvas" width="1080" height="2600"></canvas><p class="foot">宫墙深深，愿你始终做自己的主角。<br>角色画像为本测试原创风格化卡通插画。测试根据剧中人物的处事方式与性格特征进行娱乐性归类，并非官方心理测评。</p></section><footer class="foot">灵感取自电视剧《甄嬛传》人物群像 · 趣味测试</footer></main><script>
const people=[{"id": "zhenhuan", "name": "甄嬛", "title": "清醒的掌局者", "quote": "愿得一心人，白首不相离。", "desc": "你聪慧通透，重情却不困于情。历经变化仍能守住本心，在复杂局势中看清方向。", "tags": ["聪慧", "坚韧", "清醒"], "color": "#9e2731", "deep": ["你习惯先观察，再决定如何回应。面对复杂的人际关系，你会留意言语背后的动机，也会判断眼前的选择会把自己带向哪里。你并非没有情绪，只是不愿让一时的委屈替自己决定人生。你珍惜真心，却不会轻易交付全部信任；你希望被理解，也始终在意自己是否保有选择的自由。", "你真正突出的能力，是在变化中重新建立秩序。遇到难题时，你能把混乱拆解成一件件可处理的事，既看眼前，也顾及长远。你有同理心，懂得体察他人的处境，却不会因此完全放弃判断。你可以温柔，也可以坚定；可以为重要的人付出，也能在必要时重新站回自己这一边。", "你需要留意的是，太习惯做清醒、可靠的那个人，容易把疲惫藏得太深。你可能总想着等事情处理妥当，再来安放自己的感受。其实，表达脆弱不是失去掌控，寻求帮助也不是能力不足。请允许自己偶尔不必周全，不必永远正确。你的人生不只需要漂亮的答案，也值得拥有真实而松弛的时刻。"]}, {"id": "huafei", "name": "华妃", "title": "炽烈的真性情", "quote": "皇上，你害得世兰好苦啊。", "desc": "你热烈坦荡，爱憎分明。认定的事便全力以赴，拥有耀眼的生命力，也渴望被坚定珍惜。", "tags": ["热烈", "骄傲", "真诚"], "color": "#a83b27", "deep": ["你对喜欢与不喜欢有着鲜明的感受，很少把重要的心意藏得滴水不漏。遇到欣赏的人，你愿意热情靠近；面对在意的事，你也希望认真争取。你看重关系里的回应与诚意，不喜欢反复猜测，更不愿用委屈自己换取表面平静。你有骄傲的一面，那并不只是好胜，也是你对自我价值的珍视。", "你的力量来自充沛的生命力和直接的行动。你敢表达、敢承担，也愿意为自己认定的人和目标投入热情。你不喜欢冷漠敷衍，身边的人往往能感受到你的存在感与感染力。遇到挑战时，你容易被激起斗志；只要把热情放在值得的方向，你就能成为那个点燃气氛、推动事情向前的人。", "你需要留意的是，越在意，越容易被忽略和冷淡刺痛。有时你会在情绪最满的时候急着要一个答案，也可能把暂时的疏远理解成彻底的否定。给自己一点缓冲，让情绪先落下来，再决定要不要回应。真正的骄傲不是从不受伤，而是即使受伤，也不把自己的价值交给别人的态度来评判。"]}, {"id": "yixiu", "name": "皇后·宜修", "title": "冷静的布局者", "quote": "臣妾做不到啊。", "desc": "你擅长观察与规划，情绪不轻易外露。面对竞争会先权衡利弊，追求秩序、掌控与安全感。", "tags": ["理性", "谋略", "克制"], "color": "#4c3933", "deep": ["你对环境变化有很强的觉察，习惯先看清规则、关系和资源如何运转，再决定下一步。面对不确定，你会寻找可控的部分，把复杂问题拆成步骤，尽量避免仓促下注。你不轻易暴露全部想法，也不喜欢把重要结果交给运气。对你而言，安全感往往来自准备充分、边界清楚，以及事情仍在自己的理解范围之内。", "你的优势是规划、耐心与风险意识。你能够想到事情的后续影响，愿意为了长期目标暂缓即时满足；在团队中，你常常能发现别人忽略的细节，并提前安排好可能出现的变化。你不一定喜欢站在最显眼的位置，却希望关键环节可靠、有序。你的冷静并非没有感情，而是更习惯先处理问题，再安放情绪。", "你需要留意的是，当安全感过度依赖掌控，关系便容易变成一场持续防守。不是每一次意外都意味着失控，也不是每一次示弱都会让你失去主动。试着给别人一点参与和解释的空间，也给自己留一点试错余地。真正稳固的秩序，不是所有事情都按计划发生，而是即使计划改变，你依然相信自己能够应对。"]}, {"id": "meizhuang", "name": "沈眉庄", "title": "端庄的清醒派", "quote": "宁可枝头抱香死，不曾吹落北风中。", "desc": "你温柔有原则，待人宽厚却不失边界。看重体面与真心，不愿为了迎合别人丢掉自尊。", "tags": ["端庄", "独立", "通透"], "color": "#477b69", "deep": ["你心里有一把相对稳定的尺，知道什么值得坚持，也知道哪些热闹不必参与。你愿意体谅别人，懂得照顾关系里的分寸，却不会把温和误解成一味退让。比起短暂的赞许，你更在意言行是否一致、承诺是否可信。你希望自己做出的选择经得起内心审视，即使无人看见，也能坦然承认那是自己的决定。", "你的力量在于稳定、克制和清晰的边界感。你不急于争抢每一个位置，也不愿为眼前好处轻易牺牲长久的尊严。你能认真倾听，也有独立判断；面对纷扰时，你更愿意先守住原则，再寻找合适的表达方式。你给人的可靠感，往往不是来自强势，而是来自说到做到、情绪有度和内心有定见。", "你需要留意的是，太在意体面，有时会让真实的委屈被悄悄收起来。你可能习惯替别人考虑，却忘了自己的感受同样需要被认真对待。原则不必总靠沉默维护，温柔也不意味着不能拒绝。试着更直接地说出需要、讲清界限，你不会因此失去端庄，反而能让善意不再以消耗自己为代价。"]}, {"id": "anlingrong", "name": "安陵容", "title": "敏感的努力家", "quote": "人心易变，唯有自己可靠。", "desc": "你细腻敏锐，很会察觉气氛变化。你渴望认可，也愿意默默打磨自己，真正需要的是稳定的自信。", "tags": ["细腻", "勤奋", "敏锐"], "color": "#617d9a", "deep": ["你对细节和气氛格外敏感，别人语气的变化、关系中微妙的距离，常常逃不过你的观察。你愿意学习，也肯花时间默默练习，希望凭借自己的努力获得认可。你并不一定喜欢成为焦点，却很在意自己是否被认真看见。有时，你会不自觉地从他人的反应里寻找答案，试图确认自己是否足够好、是否值得被喜欢。", "你的优势是细腻、适应力和持续打磨自己的能力。你能注意到容易被忽略的部分，也擅长从反馈中发现改进方向。遇到陌生环境，你可能先观察再行动，但一旦找到方法，就能安静而持续地积累实力。你的敏锐可以成为理解他人、捕捉机会的天赋；你的认真，也能把看似微小的进步一点点变成真正的本领。", "你需要留意的是，敏锐不代表每个眼神都在评价你，每一次沉默也未必是在否定你。别让一句无心的话，变成衡量整个人生的尺。你可以在意他人的感受，但不必把所有人的满意都当作自己的责任。请慢慢把目光从“别人觉得我怎样”，移回“我想成为怎样的人”，让努力重新为自己而发生。"]}, {"id": "fuchaguiren", "name": "富察贵人", "title": "温婉的自在派", "quote": "宠辱不惊，方得自在。", "desc": "你偏爱安稳舒适的生活，懂得享受当下。与其卷入纷争，不如守好自己的小天地。", "tags": ["温婉", "松弛", "知足"], "color": "#b17b43", "deep": ["你对生活的期待往往具体而朴素：熟悉的环境、舒服的节奏、真诚可靠的人，以及不被无谓纷争打扰的日常。你不一定缺少目标，只是习惯先判断一件事是否值得投入。比起时时站在聚光灯下，你更希望生活有余裕，能够按照自己的步调安排时间，也保留一点享受小确幸的空间。", "你的优势是懂得取舍，也知道如何保护自己的能量。你能从一顿饭、一段闲谈或一个熟悉的习惯中获得安定，不会轻易把所有事情都变成输赢。面对复杂争执，你常能意识到哪些消耗并不值得。你并非没有能力，只是更愿意把力气留给真正重要的人和事，这种选择本身也是一种清醒。", "你需要留意的是，避免冲突有时会慢慢变成回避表达。你可能为了维持舒服的气氛，把不满说成没关系，把想要的机会让给更主动的人。安稳不等于永远不改变，温和也不等于没有主张。试着为自己提出一个明确愿望，争取一次真正想要的机会。你值得拥有的不只是安稳，还有主动选择生活的底气。"]}, {"id": "qipin", "name": "祺嫔", "title": "直率的行动派", "quote": "心有所向，便勇敢争取。", "desc": "你行动果断，不喜欢把想法藏得太深。目标明确时冲劲十足，但也要记得给自己留一点余地。", "tags": ["直率", "果敢", "行动力"], "color": "#a45b75", "deep": ["你有鲜明的目标感和存在感需求，想到什么便希望尽快推动，不喜欢长时间停留在犹豫里。你在意自己的能力是否被看见，也希望付出能够得到明确回应。遇到竞争时，你容易被激起斗志；越是有挑战，越想证明自己并不逊色。你不太愿意默默等待机会，更倾向于主动走到场上，为自己争取位置。", "你的优势是行动快、表达直接、敢于争取。需要有人站出来时，你往往不会躲在后面；目标清楚时，你也能迅速聚拢注意力，把想法变成行动。你有带动气氛的能力，不喜欢拖泥带水。若能把好胜心转化为持续精进的动力，你会比单纯追求一时胜负走得更远，也更容易获得真正的认可。", "你需要留意的是，速度并不总等于主动权。情绪上头时，你可能把不同意见看成阻碍，也容易为了赢下一刻而忽略更长远的关系。不是每一场较量都值得参加，也不是每一次沉默都意味着退让。先问清自己真正想得到什么，再选择表达和行动的方式。克制不是示弱，而是让你的锋芒更精准、更有分量。"]}, {"id": "qifei", "name": "齐妃", "title": "朴实的守护者", "quote": "平平淡淡，也有自己的欢喜。", "desc": "你重视熟悉的人与生活秩序，心思朴实，愿意为在乎的人付出。你的可贵在于真诚与踏实。", "tags": ["朴实", "顾家", "真诚"], "color": "#64806c", "deep": ["你看重熟悉感与归属感。比起复杂的人情博弈，你更愿意把心思放在日常生活和亲近的人身上。你表达关心的方式也许不够华丽，却常常落在具体的小事里：记得别人的习惯、照料生活细节、在熟悉的关系中守住承诺。对你而言，稳定的陪伴和踏实的日子，比外在的热闹更有分量。", "你的优势是踏实、念旧和重情。你不轻易追逐虚浮的东西，愿意在熟悉的关系里持续付出，也能从重复而平凡的日常中获得满足。当周围人陷入比较与争执时，你往往更愿意把心力留给身边的人。你身上有一种朴素的温度，让人感到生活并非只有竞争，也可以有照料、陪伴与安稳。", "你需要留意的是，太依赖熟悉的安排，可能让你在变化面前少了一点主动。你也许习惯先听别人的意见，久而久之，自己的愿望反而变得模糊。善良值得珍惜，但不必总用迁就来证明。试着独立做一次决定，为自己安排一件真正喜欢的事。照顾别人之外，也请把自己的生活放在心上。"]}];const questions=[["初到陌生环境，你最先做什么？",[["先摸清规则、人际关系，再决定如何行动",{"zhenhuan":3,"yixiu":1}],["主动表达自己，不愿被当成透明人",{"huafei":3,"qipin":1}],["先观察气氛，确认谁值得信任",{"anlingrong":2,"meizhuang":1}],["安顿好自己的生活节奏，不急着出头",{"qifei":2,"fuchaguiren":2}]]],["被人当众误解时，你会？",[["先稳住情绪，找机会用事实澄清",{"zhenhuan":3,"meizhuang":1}],["当场说清楚，不接受被轻慢",{"huafei":3,"qipin":1}],["记下细节，判断对方真正的意图",{"yixiu":3,"anlingrong":1}],["不想纠缠，尽量远离是非",{"fuchaguiren":2,"qifei":2}]]],["你最看重亲密关系里的什么？",[["彼此尊重，也能一起成长",{"zhenhuan":2,"meizhuang":2}],["坚定偏爱，热烈回应",{"huafei":3,"qipin":1}],["稳定可靠，承诺能兑现",{"meizhuang":2,"qifei":1,"yixiu":1}],["被理解、被看见，不必总是逞强",{"anlingrong":3,"fuchaguiren":1}]]],["遇到竞争者，你通常？",[["提升自己，等待合适时机反超",{"zhenhuan":3,"anlingrong":1}],["正面较量，绝不轻易认输",{"huafei":2,"qipin":2}],["研究规则和各方立场，先布局",{"yixiu":3,"zhenhuan":1}],["衡量值不值得，不把精力耗在无谓争斗",{"meizhuang":2,"fuchaguiren":2}]]],["别人一句无心的话让你不舒服，你会？",[["琢磨话里的意思，确认是不是自己多想",{"anlingrong":3,"zhenhuan":1}],["直接问清楚，不喜欢猜来猜去",{"huafei":2,"qipin":2}],["记住这个细节，观察之后的言行",{"yixiu":3,"anlingrong":1}],["提醒自己别往心里去",{"qifei":2,"fuchaguiren":2}]]],["压力很大时，你最常用的方式是？",[["复盘经历，找出下一步的突破口",{"zhenhuan":3,"meizhuang":1}],["找信任的人倾诉，得到情感回应",{"huafei":2,"anlingrong":2}],["列出计划，把局面重新掌握在手里",{"yixiu":3,"qipin":1}],["做熟悉的小事，让自己安定下来",{"qifei":2,"fuchaguiren":2}]]],["如果必须做一个艰难决定，你更相信？",[["长远判断，即使眼下要忍耐",{"zhenhuan":3,"yixiu":1}],["内心真实的感受，不 ctx.textAlign='center';ctx.fillStyle='#536c5b';ctx.font='30px serif';ctx.fillText('宫 · 廷 · 人 · 生 · 图 · 鉴',540,145);ctx.fillStyle='#9a8055';ctx.font='23px serif';ctx.fillText('一场关于性情、选择与内心秩序的映照',540,193);

let iw=700,ih=620,scale=Math.max(iw/img.width,ih/img.height),dw=img.width*scale,dh=img.height*scale;ctx.save();ctx.beginPath();ctx.rect(190,455,iw,ih);ctx.clip();ctx.drawImage(img,190+(iw-dw)/2,455+(ih-dh)/2,dw,dh);ctx.restore();ctx.strokeStyle='#b69a68';ctx.lineWidth=4;ctx.strokeRect(184,449,iw+12,ih+12);ctx.strokeStyle='#e1d4b9';ctx.lineWidth=2;ctx.strokeRect(195,460,iw-10,ih-10);
